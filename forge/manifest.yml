modules:
  jira:issuePanel:
    - key: timelogger-issue-panel
      resource: main
      resolver:
        function: resolver
      title: Timelogger
      icon: resource:main;icons/timelogger.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/dist
app:
  id: ari:cloud:ecosystem::app/17f7dd95-08b9-4a28-9800-55c4f2ec402c
  runtime:
    name: nodejs24.x
permissions:
  scopes:
    - storage:app
  external:
    fetch:
      backend:
        - address: https://timelogger-gilt.vercel.app
  content:
    styles:
      - unsafe-inline
